[package]
name = "novakey"
version = "0.1.0"
description = "NovaKey RP2040 macropad firmware (RMK)"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk.git", default-features = false, features = [
    "defmt",
    "rp2040",
    "ssd1306",
    "watchdog",
] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "defmt",
    "time-driver",
    "critical-section-impl",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-usb = { version = "0.6", features = ["defmt"] }
display-interface = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"
embedded-graphics = "0.8"
static_cell = "2"
cortex-m-rt = "0.7.5"
portable-atomic = { version = "1", features = ["critical-section"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[[bin]]
name = "novakey"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
